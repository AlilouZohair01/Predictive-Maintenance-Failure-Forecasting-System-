[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-maintenance"
version = "0.1.0"
description = "FD001 predictive maintenance models and inference API"
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"predictive_maintenance.api" = ["examples/*.json"]
"predictive_maintenance.dashboard" = ["assets/*.css"]
